<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="referrer" content="no-referrer">
<title>Komainu builder: edit your AI guardrails</title>
<meta name="description" content="The Komainu guardrails editor. Choose areas, review rules, import your own, and copy one command. Nothing is stored or sent.">
<meta name="author" content="Spinetta Inc.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232DD4BF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='4' fill='%230B0D10' stroke='none'/%3E%3Cpath d='M12 3l8 3v6c0 4.500-3.500 7.500-8 9-4.500-1.500-8-4.500-8-9V6zM12 3v18M8 10.500v3M16 12h.01'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app">
<a class="skip" href="#main">Skip to the editor</a>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Komainu home" data-home><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.500-3.500 7.500-8 9-4.500-1.500-8-4.500-8-9V6z"/><path d="M12 3v18"/><path d="M8 10.500v3"/><path d="M16 12h.01"/></svg>komainu</a>
  <span class="crumb">builder</span>
  <span class="private" title="This page has no backend, makes no requests and uses no browser storage.">nothing stored · nothing sent</span>
  <a class="crumb link" href="templates.html" data-online>templates</a>
  <span class="spacer"></span>
  <span class="count" id="top-count" role="status"></span>
  <button type="button" class="btn primary compact" id="top-copy">Copy command</button>
</header>

<div class="editor">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="out" aria-label="Output">
    <div id="stats" class="stats" role="status"></div>
    <div class="tabs" role="tablist" aria-label="Output">
      <button type="button" role="tab" id="tab-command" aria-controls="panel" data-tab="command" aria-selected="true">command</button>
      <button type="button" role="tab" id="tab-script" aria-controls="panel" data-tab="script" aria-selected="false" tabindex="-1">offline script</button>
      <button type="button" role="tab" id="tab-agent" aria-controls="panel" data-tab="agent" aria-selected="false" tabindex="-1">ai agent</button>
      <button type="button" role="tab" id="tab-files" aria-controls="panel" data-tab="files" aria-selected="false" tabindex="-1">files</button>
      <button type="button" role="tab" id="tab-quiz" aria-controls="panel" data-tab="quiz" aria-selected="false" tabindex="-1">quiz</button>
      <button type="button" role="tab" id="tab-share" aria-controls="panel" data-tab="share" aria-selected="false" tabindex="-1">share</button>
    </div>
    <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-command"></div>
  </aside>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/builder.js" defer></script>
</body>
</html>
